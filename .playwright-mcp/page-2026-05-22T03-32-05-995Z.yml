            - generic [ref=e235]: Yes! Sshelf is open-source and free to self-host. You can use it for personal or commercial projects without any license fees.
          - generic [ref=e236]:
            - button "How secure is the credential storage?" [ref=e237] [cursor=pointer]:
              - generic [ref=e238]: How secure is the credential storage?
              - img [ref=e239]
            - generic [ref=e241]: Extremely. We use AES-256-GCM encryption. The encryption key is derived from your unique APP_KEY. Even if your database is compromised, your credentials remain encrypted.
          - generic [ref=e242]:
            - button "Can I use it with my existing SSH keys?" [ref=e243] [cursor=pointer]:
              - generic [ref=e244]: Can I use it with my existing SSH keys?
              - img [ref=e245]
            - generic [ref=e247]: Absolutely. You can import your existing private keys or generate new Ed25519 keys directly within Sshelf.
          - generic [ref=e248]:
            - button "What happens if I lose my APP_KEY?" [ref=e249] [cursor=pointer]:
              - generic [ref=e250]: What happens if I lose my APP_KEY?
              - img [ref=e251]
            - generic [ref=e253]: Your APP_KEY is the master key for all encryption. If you lose it, you will lose access to all stored passwords and private keys. We recommend backing it up securely.
